<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tether Meter v1.4</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--card-b:#222;--text:#fff;--sub:#999;--muted:#666;--gauge-bg:#1a1a1a;--gauge-fg:#fff;--input-bg:#0a0a0a;--input-b:#2a2a2a;--btn-bg:#fff;--btn-c:#000}
[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--card-b:#e5e5ea;--text:#111;--sub:#666;--muted:#999;--gauge-bg:#e5e5ea;--gauge-fg:#111;--input-bg:#fff;--input-b:#d1d1d6;--btn-bg:#111;--btn-c:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh;transition:all 0.3s}
h1{font-size:11px;letter-spacing:3px;color:var(--muted);margin:8px 0 14px}
#themeToggle{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--card-b);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:100}

/* 탭 메뉴 */
.tabs{display:flex;width:100%;max-width:380px;background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:4px;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s}
.tab-btn.active{background:var(--btn-bg);color:var(--btn-c)}

/* 탭 컨텐츠 */
.tab-content{display:none;width:100%;max-width:380px;flex-direction:column;align-items:center}
.tab-content.active{display:flex}

/* 게이지 */
.gauge-wrap{position:relative;width:290px;height:290px;margin:10px 0}
svg{transform:rotate(-90deg);width:100%;height:100%}
.bg{fill:none;stroke:var(--gauge-bg);stroke-width:18}
.fg{fill:none;stroke:var(--gauge-fg);stroke-width:18;stroke-linecap:round;transition:stroke-dashoffset 0.8s ease}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1}
.unit{font-size:18px;color:var(--sub)}
.sub{font-size:13px;color:var(--sub);margin-top:6px;text-align:center}

/* 카드 및 폼 */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:18px;width:100%;margin-top:14px;transition:all 0.3s}
.card h2{font-size:14px;margin-bottom:10px}
label{font-size:11px;color:var(--sub);display:block;margin:10px 0 4px}
input{width:100%;padding:12px;background:var(--input-bg);border:1px solid var(--input-b);border-radius:10px;color:var(--text);font-size:14px}
button.action-btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;margin-top:14px}
.btn-white{background:var(--btn-bg);color:var(--btn-c)}
.btn-dark{background:var(--card);color:var(--text);border:1px solid var(--card-b)}
small{color:var(--muted);font-size:11px;display:block;margin-top:6px;line-height:1.5}
.log{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;white-space:pre-wrap;line-height:1.5}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
<button id="themeToggle">☀️</button>
<h1>TETHER METER v1.4</h1>

<!-- 상단 탭 버튼 -->
<div class="tabs">
  <button id="tabBtnMonitor" class="tab-btn active" onclick="switchTab('monitor')">📊 모니터</button>
  <button id="tabBtnSettings" class="tab-btn" onclick="switchTab('settings')">⚙️ 설정</button>
</div>

<!-- 1. 모니터 탭 -->
<div id="tabMonitor" class="tab-content active">
  <div class="gauge-wrap">
    <svg viewBox="0 0 200 200">
      <circle class="bg" cx="100" cy="100" r="85"></circle>
      <circle id="fg" class="fg" cx="100" cy="100" r="85" stroke-dasharray="534" stroke-dashoffset="534"></circle>
    </svg>
    <div class="center">
      <div id="big" class="big">--<span class="unit">GB</span></div>
      <div id="sub" class="sub">데이터 대기중</div>
    </div>
  </div>
  <div class="card">
    <div id="log" class="log">연결 대기중...</div>
  </div>
</div>

<!-- 2. 설정 탭 -->
<div id="tabSettings" class="tab-content">
  <div class="card">
    <h2>📡 Firebase 연동 설정</h2>
    <label>Database URL (필수)</label>
    <input id="cfgDbUrl" placeholder="https://xxx-default-rtdb.firebaseio.com">
    <label>API Key (선택)</label>
    <input id="cfgApiKey" placeholder="AIzaSy...">
    <label>Project ID (선택)</label>
    <input id="cfgProjectId" placeholder="my-project-id">
    <small>Firebase 콘솔 > 프로젝트 설정 또는 Realtime Database의 URL을 입력합니다.</small>
  </div>

  <div class="card">
    <h2>⚖️ 용량 및 보정 설정</h2>
    <label>총 제공 용량 (GB)</label>
    <input id="cfgTotal" type="number" inputmode="decimal" placeholder="30">
    <label>오차 보정량 (GB) - 사용한 만큼 뺄 때 마이너스(-) 입력</label>
    <input id="cfgOffset" type="number" inputmode="decimal" placeholder="예: -1.5">
    <small>A25 측정 원본 잔량에 이 보정값이 합산되어 모니터에 표시됩니다.</small>

    <button id="saveBtn" class="action-btn btn-white" onclick="saveSettings()">설정 저장 및 연결</button>
    <div id="cfgLog" class="log"></div>
  </div>
</div>

<script>
const CIRC = 2 * Math.PI * 85;
const $ = id => document.getElementById(id);
const getParam = k => new URLSearchParams(location.search).get(k);

let currentFirebaseApp = null;

// 탭 전환
function switchTab(tab) {
  if (tab === 'monitor') {
    $('tabMonitor').classList.add('active');
    $('tabSettings').classList.remove('active');
    $('tabBtnMonitor').classList.add('active');
    $('tabBtnSettings').classList.remove('active');
  } else {
    $('tabMonitor').classList.remove('active');
    $('tabSettings').classList.add('active');
    $('tabBtnMonitor').classList.remove('active');
    $('tabBtnSettings').classList.add('active');
  }
}

// 화면 렌더링
function upd(left, total, src) {
  const offset = parseFloat(localStorage.getItem('tether_offset') || '0');
  const originalLeft = parseFloat(left);
  if (isNaN(originalLeft)) return;

  const adjustedLeft = originalLeft + offset;
  const maxTotal = parseFloat(total) || parseFloat(localStorage.getItem('tether_total') || '30');

  const pct = Math.max(0, Math.min(100, (adjustedLeft / maxTotal) * 100));
  $('big').innerHTML = adjustedLeft.toFixed(1) + '<span class="unit">GB</span>';
  $('sub').textContent = `${adjustedLeft.toFixed(1)}GB 남음 / ${maxTotal}GB (${Math.round(pct)}%)`;
  $('fg').style.strokeDashoffset = CIRC * (1 - pct / 100);
  $('fg').style.stroke = pct < 15 ? '#ef4444' : pct < 30 ? '#f59e0b' : 'var(--gauge-fg)';

  localStorage.setItem('tether_left', originalLeft);
  $('log').textContent = `[${src}] 보정: ${offset >= 0 ? '+' : ''}${offset}GB\n${new Date().toLocaleTimeString('ko-KR')} 갱신됨`;
}

// Firebase 연결
function connectFirebase() {
  const dbUrl = localStorage.getItem('tether_fb_db_url');
  if (!dbUrl) {
    $('log').textContent = '⚠️ 설정 탭에서 Firebase Database URL을 입력해 주세요.';
    return;
  }

  try {
    const config = {
      databaseURL: dbUrl.trim(),
      apiKey: (localStorage.getItem('tether_fb_api_key') || '').trim(),
      projectId: (localStorage.getItem('tether_fb_proj_id') || '').trim()
    };

    if (firebase.apps.length > 0) {
      firebase.app().delete().then(() => initAndListen(config));
    } else {
      initAndListen(config);
    }
  } catch (err) {
    $('log').textContent = 'Firebase 초기화 에러: ' + err.message;
  }
}

function initAndListen(config) {
  try {
    currentFirebaseApp = firebase.initializeApp(config);
    const db = firebase.database();
    $('log').textContent = 'Firebase 수신 대기 중...';

    db.ref('tethering').on('value', snapshot => {
      const val = snapshot.val();
      if (val !== null && val !== undefined) {
        const left = typeof val === 'object' ? (val.left ?? val.remain) : val;
        const total = typeof val === 'object' ? val.total : null;
        upd(left, total, 'Firebase 실시간');
      }
    }, error => {
      $('log').textContent = 'Firebase 읽기 실패 (규칙 확인 필요): ' + error.message;
    });
  } catch (e) {
    $('log').textContent = '연결 오류: ' + e.message;
  }
}

// 설정 저장
function saveSettings() {
  const dbUrl = $('cfgDbUrl').value.trim();
  const apiKey = $('cfgApiKey').value.trim();
  const projId = $('cfgProjectId').value.trim();
  const total = $('cfgTotal').value.trim() || '30';
  const offset = $('cfgOffset').value.trim() || '0';

  localStorage.setItem('tether_fb_db_url', dbUrl);
  localStorage.setItem('tether_fb_api_key', apiKey);
  localStorage.setItem('tether_fb_proj_id', projId);
  localStorage.setItem('tether_total', total);
  localStorage.setItem('tether_offset', offset);

  $('cfgLog').textContent = '✅ 설정이 저장되었습니다. 모니터를 갱신합니다.';
  connectFirebase();

  const sl = localStorage.getItem('tether_left');
  if (sl) upd(sl, total, '설정 변경');

  setTimeout(() => switchTab('monitor'), 800);
}

// 테마 토글
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('tether_theme', t);
  $('themeToggle').textContent = t === 'light' ? '🌙' : '☀️';
}
const savedTheme = localStorage.getItem('tether_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
applyTheme(savedTheme);
$('themeToggle').onclick = () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
};

// 초기화
window.addEventListener('DOMContentLoaded', () => {
  $('cfgDbUrl').value = localStorage.getItem('tether_fb_db_url') || '';
  $('cfgApiKey').value = localStorage.getItem('tether_fb_api_key') || '';
  $('cfgProjectId').value = localStorage.getItem('tether_fb_proj_id') || '';
  $('cfgTotal').value = localStorage.getItem('tether_total') || '30';
  $('cfgOffset').value = localStorage.getItem('tether_offset') || '0';

  const lp = getParam('left'), tp = getParam('total');
  if (lp) {
    upd(lp, tp || '30', 'URL 파라미터');
  } else {
    const sl = localStorage.getItem('tether_left');
    if (sl) upd(sl, localStorage.getItem('tether_total') || '30', '저장된 캐시');
  }

  connectFirebase();
});
</script>
</body>
</html>
